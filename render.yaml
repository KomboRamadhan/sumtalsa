services:
  - type: web
    name: sumtalsa
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "480"
      - key: FORCE_HTTPS
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: sumtalsa-db
          property: connectionString
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_SUPERADMIN_NAME
        value: "SumTalsa Super Admin"
      - key: AI_PROVIDER
        value: "mock"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false

databases:
  - name: sumtalsa-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: sumtalsa
    user: sumtalsa
